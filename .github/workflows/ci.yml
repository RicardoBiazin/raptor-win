name: CI

# Compila o scanner e roda um smoke test: o raptor-win precisa detectar as
# vulnerabilidades plantadas em test/fixtures (weak hash, command injection, SSRF).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar
        run: python -m py_compile raptor_win.py
      - name: Instalar Semgrep
        run: python -m pip install --quiet semgrep
      - name: Smoke scan das amostras
        run: |
          # sample_vuln/ (não 'test/', que o Semgrep ignora por padrão)
          python raptor_win.py sample_vuln --md report.md --json-out findings.json
          echo '--- report ---'; cat report.md
          # o scanner tem de ter achado ao menos uma vulnerabilidade nas amostras
          grep -Eq 'CRITICAL|ERROR|HIGH|WARNING' report.md
      - name: As regras do registro precisam ter carregado
        run: |
          # O passo anterior passa mesmo se NENHUM pacote do registro
          # baixar: as regras locais em rules/raptor sozinhas já acham
          # coisa nas amostras. Quando o registro cai — rede, mudança de
          # nome de pacote, indisponibilidade —, o Semgrep devolve JSON
          # válido com zero resultados e o relatório dizia "Nenhum achado
          # ✅". Um scanner que responde "está limpo" quando não analisou
          # é pior que scanner nenhum: gera confiança onde não houve
          # verificação.
          #
          # Com --no-raptor só o registro pode disparar. Se não achar
          # nada aqui, ou o registro não carregou ou as amostras pararam
          # de casar com ele — os dois merecem falhar a build.
          python raptor_win.py sample_vuln --no-raptor --md registro.md
          echo '--- registro ---'; cat registro.md
          grep -Eq 'CRITICAL|ERROR|HIGH|WARNING' registro.md

      - name: Erro do Semgrep não pode virar relatório limpo
        run: |
          # Quando uma configuração falha, o Semgrep devolve JSON VÁLIDO
          # com results:[] e o motivo em errors[]. A ferramenta tem de
          # RECUSAR o relatório, não imprimir "Nenhum achado ✅".
          #
          # A falha é provocada por uma regra local inválida, e não por um
          # pacote inexistente do registro: assim o teste não depende de
          # rede nem de o registro devolver 404 para sempre. O caminho de
          # código exercitado é o mesmo — errors[] com level "error".
          mkdir -p /tmp/regras-ruins /tmp/alvo
          printf 'rules:\n  - id: sem-message\n    pattern: $X\n' > /tmp/regras-ruins/r.yaml
          echo 'const a = 1' > /tmp/alvo/a.js
          if python raptor_win.py /tmp/alvo --no-registry \
               --raptor-rules /tmp/regras-ruins > falho.txt 2>&1; then
            echo "ERRO: relatou sucesso apesar do erro do Semgrep"; cat falho.txt; exit 1
          fi
          cat falho.txt
          grep -q 'NÃO é confiável' falho.txt

      - name: Arquivo ilegível NÃO derruba a análise
        run: |
          # A guarda acima não pode ser larga demais. Medido antes de
          # escrevê-la: fonte com sintaxe inválida não entra em errors[],
          # o Semgrep a ignora. Este passo trava esse comportamento — sem
          # ele, um .js minificado no repositório quebraria a build de
          # quem usa a ferramenta.
          mkdir -p /tmp/alvo2
          printf 'function x( {\n  return\n' > /tmp/alvo2/quebrado.js
          echo 'const ok = 1' >> /tmp/alvo2/bom.js
          python raptor_win.py /tmp/alvo2 --no-registry

      - name: Fixture plantada nao conta como problema a resolver
        run: |
          # A ferramenta acusava a si mesma: as falhas de sample_vuln/ estao ali
          # de proposito, e apareciam na conta de achados que exigem atencao.
          # Um scanner que reporta as proprias fixtures ensina o usuario a
          # ignorar o relatorio.
          #
          # Os achados CONTINUAM no relatorio (o passo de smoke acima depende
          # disso) — o que muda e a classificacao.
          python raptor_win.py sample_vuln --no-registry > fix.txt 2>&1
          cat fix.txt
          grep -q 'exigem aten' fix.txt
          grep -Eq 'exigem aten\S+o: 0' fix.txt
          grep -q 'fixture' fix.txt

      - name: Nome de teste em portugues e reconhecido
        run: |
          # A heuristica so conhecia ingles: 'tests/' casava, 'testes/' nao, e a
          # regra de nome de arquivo exigia ponto logo depois ('app.test.ts'),
          # entao 'teste_injecao.py' era contado como codigo de producao. Em base
          # escrita em portugues isso e o padrao, nao a excecao.
          #
          # 'testar_conexao.py' NAO pode casar: 'testar' e verbo de codigo real.
          python - <<'EOF'
          from raptor_win import TOOLING_RE as T
          casos_tooling = ['testes/x.py', 'teste_injecao.py', 'src/foo_teste.py',
                           'test_foo.py', 'src/foo_test.py', 'spec-foo.js']
          casos_reais = ['src/testar_conexao.py', 'src/lib/format.ts',
                         'src/pages/Contatos.tsx']
          for c in casos_tooling:
              assert T.search(c), f'deveria ser tooling: {c}'
          for c in casos_reais:
              assert not T.search(c), f'NAO deveria ser tooling: {c}'
          print('ok')
          EOF

      - name: .env versionado — severidade pelo CONTEUDO, nao pelo nome
        run: |
          # Julgar pelo nome erra nos dois sentidos: deixa passar um .env.prod
          # cheio de chave real e acusa como HIGH um .env.demo que so tem
          # 'MARCA=PDV Demo'. O aviso preventivo continua nos dois casos, porque
          # a razao dele e o futuro; a severidade e que precisa ser honesta.
          mkdir -p /tmp/env-limpo && cd /tmp/env-limpo && git init -q
          echo 'node_modules' > .gitignore
          printf 'VITE_MARCA_NOME=PDV Demo\nVITE_MODO=1\nVITE_URL=\n' > .env.demo
          cd - >/dev/null
          python raptor_win.py /tmp/env-limpo --secrets --no-raptor --no-registry > env1.txt 2>&1 || true
          cat env1.txt
          grep -q 'arquivo-nao-ignorado' env1.txt   # o aviso continua
          grep -q 'INFO' env1.txt                   # mas nao compete com chave real
          # Com credencial de verdade dentro, volta a ser HIGH.
          mkdir -p /tmp/env-sujo && cd /tmp/env-sujo && git init -q
          echo 'node_modules' > .gitignore
          KEY='AKIA''ABCDEFGHIJKLMNOP'
          printf "AWS_ACCESS_KEY_ID=%s\n" "$KEY" > .env.demo
          cd - >/dev/null
          python raptor_win.py /tmp/env-sujo --secrets --no-raptor --no-registry > env2.txt 2>&1 || true
          cat env2.txt
          grep -q 'HIGH' env2.txt

      - name: Smoke da varredura de credenciais
        run: |
          # Fixture: um .env com senha, FORA do .gitignore — o cenário que
          # a checagem de exposição existe para pegar antes de virar commit.
          mkdir -p /tmp/segredos && cd /tmp/segredos && git init -q
          # As credenciais falsas são MONTADAS em pedaços, de propósito.
          # Escritas inteiras, o próprio raptor-win as acusava neste
          # arquivo — e estava certo: um scanner não tem como saber que
          # são de mentira. Concatenar mantém o valor em execução sem
          # deixar no repositório nenhuma cadeia com cara de credencial.
          SENHA='S3nh4''Real9'
          TOKEN='ghp''_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789'
          echo 'node_modules' > .gitignore
          echo "DB=postgresql://u:${SENHA}@host:5432/db" > .env
          echo "const t = \"${TOKEN}\";" > app.js
          cd - >/dev/null
          python raptor_win.py /tmp/segredos --secrets --no-raptor --no-registry > sec.txt 2>&1 || true
          cat sec.txt
          grep -q 'arquivo-nao-ignorado' sec.txt   # .env exposto ao git
          grep -q 'conexao-com-senha'    sec.txt   # senha na string de conexão
          grep -q 'github-token'         sec.txt   # token no código
      - name: Sem falso-positivo no próprio repositório
        run: |
          # A ferramenta não pode acusar a si mesma: se acusar, a regra
          # está larga demais e o relatório vira ruído.
          python raptor_win.py . --secrets --no-raptor --no-registry > self.txt 2>&1 || true
          cat self.txt
          grep -q 'Nenhuma credencial exposta' self.txt
      - name: Baseline de riscos aceitos
        run: |
          # Três comportamentos: dispensa o que tem motivo, faz voltar o
          # que venceu, e avisa da entrada que não casa com nada.
          {
            echo '[[aceito]]'
            echo 'regra  = "github-token"'
            echo 'motivo = "Fixture do smoke test; o token e falso."'
            echo 'ate    = 2027-01-01'
            echo '[[aceito]]'
            echo 'regra  = "conexao-com-senha"'
            echo 'motivo = "Fixture do smoke test; a senha e falsa."'
            echo 'ate    = 2020-01-01'
            echo '[[aceito]]'
            echo 'regra  = "regra-inexistente"'
            echo 'motivo = "Entrada obsoleta, deve ser reportada como orfa."'
          } > /tmp/base.toml
          python raptor_win.py /tmp/segredos --secrets --no-raptor --no-registry \
            --baseline /tmp/base.toml > base.txt 2>&1 || true
          cat base.txt
          grep -q 'dispensados'                    base.txt   # aceite válido
          grep -q 'VENCEU'                         base.txt   # prazo expirado volta a contar
          grep -q 'entrada sem achado'             base.txt   # órfã reportada
      - name: Baseline do PROJETO e' achado quando se escaneia de fora
        run: |
          # O padrao era procurado so' no diretorio atual. Numa varredura de
          # varios repositorios (scan-all.ps1 roda de fora, alvo por parametro),
          # o arquivo de riscos aceitos de cada projeto era ignorado em silencio
          # e o projeto voltava a reprovar por um risco ja' decidido.
          #
          # E a conta final tem de considerar o baseline: sem isso a saida diz
          # "exigem atencao: N" e tres linhas depois dispensa N.
          mkdir -p /tmp/proj-com-baseline && cd /tmp/proj-com-baseline && git init -q
          echo 'node_modules' > .gitignore
          TOKEN='ghp''_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789'
          echo "const t = \"${TOKEN}\";" > app.js
          {
            echo '[[aceito]]'
            echo 'regra  = "github-token"'
            echo 'motivo = "Fixture do teste; o token e falso."'
            echo 'ate    = 2027-01-01'
          } > .raptor-baseline.toml
          cd - >/dev/null
          # roda de FORA do projeto, sem passar --baseline
          python raptor_win.py /tmp/proj-com-baseline --secrets --no-raptor --no-registry \
            > bl.txt 2>&1 || true
          cat bl.txt
          grep -q 'dispensados' bl.txt
          grep -Eq 'exigem aten\S+o ap\S+s o baseline: 0' bl.txt

      - name: Baseline sem motivo é recusado
        run: |
          # Sem justificativa não é aceite de risco, é ocultação.
          printf '[[aceito]]\nregra = "x"\nmotivo = "ha"\n' > /tmp/ruim.toml
          if python raptor_win.py /tmp/segredos --secrets --no-raptor --no-registry \
               --baseline /tmp/ruim.toml > ruim.txt 2>&1; then
            echo "ERRO: aceitou baseline sem motivo"; cat ruim.txt; exit 1
          fi
          grep -q 'motivo' ruim.txt
