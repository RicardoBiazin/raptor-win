name: Release

# A cada tag vX.Y.Z: valida (smoke) e publica um Release com as notas montadas
# a partir dos COMMITS desde a tag anterior. Sem passo manual — marcar a tag basta.
#
# Por que não `--generate-notes`: aquele gera as notas de Pull Requests mergeados;
# como aqui se commita direto na main (sem PRs), ele sairia vazio. As notas vêm do
# `git log` entre a tag anterior e a atual.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessário para o gh criar o Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # histórico completo: precisa da tag anterior

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Não publica versão quebrada: compila e roda o smoke em sample_vuln, como o CI.
      - name: Compilar
        run: python -m py_compile raptor_win.py
      - name: Instalar Semgrep
        run: pip install semgrep
      - name: Smoke test
        run: |
          python raptor_win.py sample_vuln --md report.md
          grep -Eq 'CRITICAL|ERROR|HIGH|WARNING' report.md

      - name: Montar as notas a partir dos commits
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "## Mudanças desde ${PREV}" > NOTES.md
            RANGE="${PREV}..${TAG}"
          else
            echo "## Primeiro release" > NOTES.md
            RANGE="${TAG}"
          fi
          echo "" >> NOTES.md
          git log --no-merges --pretty='- %s' "$RANGE" >> NOTES.md

      # Idempotente de propósito. `gh release create` devolve
      # "HTTP 422: Release.tag_name already exists" e reprova o job inteiro se o
      # Release já existir — e existir é COMUM: basta alguém publicar à mão logo
      # depois de empurrar a tag. Foi o que aconteceu no v1.12.1, com 31 segundos
      # de diferença entre a criação manual e este passo.
      #
      # Reprovar ali não protege nada: o Release ESTÁ publicado e correto. Só
      # deixa um X vermelho num workflow cuja premissa é "marcar a tag basta",
      # e um X que não significa defeito é um X que se aprende a ignorar.
      #
      # NÃO sobrescreve o que já está lá. Notas escritas à mão descrevem o
      # PORQUÊ da versão; a lista de commits que este workflow monta é o
      # fallback para quando ninguém escreveu nada. Trocar uma pela outra seria
      # perder informação.
      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Rascunho é outra história: o Release existe mas NINGUÉM o vê, e o
            # workflow terminaria verde sobre uma publicação que não aconteceu.
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              echo "::error::Release $TAG existe como RASCUNHO — não está publicado."
              exit 1
            fi
            echo "::notice::Release $TAG já publicado fora deste workflow; notas preservadas."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file NOTES.md
